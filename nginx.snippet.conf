# Reverse-proxy the comments service under /api/ on the same origin as your page.
# Paste this block inside your `server { ... }`. The trailing slash on
# proxy_pass strips the /api/ prefix so the service sees /comments, /widget.js…
#
# Then include the widget on your page with:
#   <script defer src="/api/widget.js"></script>
#
# (No CORS needed this way — same origin. To instead publish the service port
#  and load the widget cross-origin, set COMMENTS_CORS_ORIGINS on the service.)
#
# `^~` ensures /api/widget.js is proxied and NOT captured by a `\.js$` regex
# location if your config has one (regex locations otherwise win over prefixes).

location ^~ /api/ {
    proxy_pass http://static-comments:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
